# Always-on heartbeat for the deployed app (scripts/heartbeat.ts): watches the Perpl Exchange
# over a Monad WebSocket and calls /api/cron the moment a copied leader trades, plus a 15s
# baseline beat and a 2-minute demo-bot decision.
# Vercel Hobby cron only fires daily, so a long-running job keeps the beat instead. Each run
# lasts just under 6 hours and the next scheduled run replaces it (concurrency group).
# Needs one repo secret: TANDEM_TICK_TOKEN (print it with `npm run engine:token`).
name: heartbeat

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: heartbeat
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TANDEM_URL: ${{ vars.TANDEM_URL || 'https://tandem-omega-opal.vercel.app' }}
      TANDEM_TICK_TOKEN: ${{ secrets.TANDEM_TICK_TOKEN }}
      NEXT_PUBLIC_AGENTS_ADDRESS: '0xf250a10986b3ce974d5d042fd53bbe2de6bbd770'
      RUN_MINUTES: '340'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsx scripts/heartbeat.ts
